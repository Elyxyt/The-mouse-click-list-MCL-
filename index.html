
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>The Mouse Click List | MCL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111111;
  color: #eeeeee;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
}

header {
  background: #191919;
  border-bottom: 1px solid #383838;
  padding: 24px 12px 20px;
  text-align: center;
}

h1 {
  color: #f0f0f0;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 1px;
  margin: 0 0 8px;
}

header p {
  color: #aaaaaa;
  font-size: 13px;
  margin: 0;
}

main {
  width: 100%;
  max-width: 760px;
  margin: 24px auto;
  padding: 0 14px;
}

.list-title {
  color: #eeeeee;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 14px;
}

input {
  display: block;
  width: 100%;
  padding: 11px 12px;
  margin-bottom: 18px;
  background: #191919;
  border: 1px solid #414141;
  border-radius: 4px;
  color: #ffffff;
  font-size: 14px;
  outline: none;
}

input:focus {
  border-color: #999999;
}

input::placeholder {
  color: #888888;
}

.demon {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  background: #1b1b1b;
  border: 1px solid #353535;
  border-radius: 3px;
  padding: 13px 12px;
  margin-bottom: 5px;
}

.rank {
  color: #bbbbbb;
  font-size: 15px;
  font-weight: bold;
  text-align: center;
}

.name {
  color: #eeeeee;
  font-weight: bold;
  text-decoration: none;
}

.name:hover {
  color: #ffffff;
  text-decoration: underline;
}

.difficulty {
  color: #aaaaaa;
  font-size: 12px;
  margin-top: 5px;
}

.tag {
  color: #cccccc;
  background: #292929;
  border: 1px solid #444444;
  border-radius: 3px;
  padding: 5px 7px;
  font-size: 10px;
  white-space: nowrap;
}

footer {
  border-top: 1px solid #333333;
  margin-top: 32px;
  padding: 20px 12px;
  color: #888888;
  font-size: 12px;
  text-align: center;
}

@media (max-width: 420px) {
  h1 {
    font-size: 23px;
  }

  main {
    padding: 0 10px;
  }

  .demon {
    grid-template-columns: 34px minmax(0, 1fr) auto;
    gap: 7px;
    padding: 12px 8px;
  }

  .tag {
    font-size: 9px;
    padding: 4px;
  }
}
</style>

</head>

<body>
<header>
<h1>THE MOUSE CLICK LIST</h1>
  <p>An independent Geometry Dash demon ranking</p>
</header>

<main>
  <div class="list-title">🏆 Demon Rankings</div>

  <input id="search"
    placeholder="Search for a demon..."
    aria-label="Search demons">

  <div id="rankings"></div>
</main>

<footer>
  Fan-made community project. Not affiliated
  with RobTop or Pointercrate.
</footer>

<script>

const demons = [
  {
    name: "Tidal 67",
    difficulty: "Extreme Demon",
    id: "88488708"
  },
  {
    name: "Acheron",
    difficulty: "Extreme Demon",
    id: "82040280"
  },
  {
    name: "Slaughterhouse",
    difficulty: "Extreme Demon",
    id: "77436731"
  },
  {
    name: "Bloodbath",
    difficulty: "Extreme Demon",
    id: "10565740"
  },
  {
    name: "Cataclysm",
    difficulty: "Extreme Demon",
    id: "3979725"
  }
];

function renderList(query = "") {
  const results = demons.filter(d =>
    d.name.toLowerCase().includes(query.toLowerCase())
  );

  document.getElementById("rankings").innerHTML =
    results.map(d => {
      const rank = demons.indexOf(d) + 1;
      return `
        <div class="demon">
          <div class="rank">#${rank}</div>
          <div>
            <a class="name"
              href="https://gdbrowser.com/${d.id}"
              target="_blank"
              rel="noopener noreferrer">
              ${d.name}
            </a>
            <div class="difficulty">${d.difficulty}</div>
          </div>
          <span class="tag">DEMON</span>
        </div>
      `;
    }).join("") ||
    "<p>No demons found. Try another name!</p>";
}

document.getElementById("search")
  .addEventListener("input", event =>
    renderList(event.target.value)
  );

renderList();
</script>
</body>
</html>
